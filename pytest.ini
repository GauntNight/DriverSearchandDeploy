[pytest]
# Pytest configuration for AutoPackager test suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Output and reporting options
addopts =
    # Verbose output
    -v
    # Show extra test summary info
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Coverage reporting (core modules only: agents, models, orchestration)
    --cov=autopackager/agents
    --cov=autopackager/models
    --cov=autopackager/orchestration
    # Exclude test files and VM providers from coverage
    --cov-config=.coveragerc
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    # Strict markers - fail on unknown markers
    --strict-markers
    # Disable warnings capture to see all warnings
    --disable-warnings
    # Show durations of slowest tests
    --durations=10

# Minimum code coverage threshold (will fail if below this)
# Starting at 0% since we're just setting up the infrastructure
# Will be raised to 70% as we add tests
# --cov-fail-under=0

# Markers for test categorization
markers =
    unit: Unit tests (isolated, no external dependencies)
    integration: Integration tests (test component interactions)
    cli: CLI command tests
    api: Web API tests
    slow: Tests that take significant time to run
    requires_redis: Tests that require Redis connection
    requires_db: Tests that require database connection
    requires_graph_api: Tests that require Microsoft Graph API
    requires_vm: Tests that require VM provider (Hyper-V)

# Asyncio configuration
asyncio_mode = auto

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout for tests (prevent hanging tests)
# timeout = 300

# Filtering
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Mock configuration - don't access real external services
env =
    TESTING=true
