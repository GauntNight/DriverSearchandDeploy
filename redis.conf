# Minimal Redis Configuration for Local Testing
# Save this as redis.conf

# Bind to localhost only (secure for testing)
bind 127.0.0.1

# Default port
port 6379

# Run in background (Linux/Mac only, comment out for Windows)
daemonize no

# Log level
loglevel notice

# Database file location
dir ./

# Save database to disk periodically
save 900 1
save 300 10
save 60 10000

# Max memory (optional, 256MB for testing)
maxmemory 256mb
maxmemory-policy allkeys-lru
