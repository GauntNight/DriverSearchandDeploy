      mode: generic
    notes: "Inno Setup (it is NOT an MSI despite common assumption). Uninstall key 'Git_is1'; detection confirmed live (v2.54.0, Ring 0). HOST-INFRA HAZARD: on a build machine whose own tooling IS Git for Windows (e.g. the agent's git-bash at C:\\Program Files\\Git), the local install validator's install->verify->UNINSTALL cycle removes the live git the host depends on -- same class as never uninstalling the running PowerShell. The Intune publish is unaffected; only the build host's git breaks mid-validation (reinstall to recover). Consider gating local validation for host-infrastructure apps; until then, validate Git on a throwaway VM or expect to reinstall."

