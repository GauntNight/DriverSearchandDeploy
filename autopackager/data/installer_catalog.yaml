# AutoPackager Installer Catalog -- Committed Baseline
#
# Known-good silent-install fingerprints + commands for MSI and EXE installers.
# `cli.py create-software-job` consults this file (plus the local overlay at
# `data/installer_catalog.local.yaml`) before requiring an --install-command.
#
# Matching strategy (MSI):
#   1. UpgradeCode exact match  (most stable across versions of the same app)
#   2. ProductCode exact match  (exact version)
#   3. ProductName pattern (substring, case-insensitive) + Publisher
#
# Template variable: {installer_filename} is the basename of the installer
# inside the .intunewin payload (no path -- Intune IME runs the command from
# the unpacked package root).
#
# BASELINE vs OVERLAY -- read before editing this file.
#
# This baseline carries only environment-AGNOSTIC fields: the MSI / EXE's own
# identity (UpgradeCode, ProductCode, ProductName, Publisher), the silent
# install / uninstall commands that derive from it, AND curated Intune
# app-attribute overrides (information_url, description, categories,
# min_os_version, icon_b64). Those values are the same in every tenant,
# every operator, every machine.
#
# Environment-SPECIFIC fields -- `first_seen`, `last_used`, `use_count`, and
# `verified_versions` (which carries `verified_intune_app_id`, a tenant-bound
# GUID) -- belong in the per-operator local overlay at
# `data/installer_catalog.local.yaml`, NOT here. The overlay is gitignored and
# accumulates organically. Do not promote those fields into the baseline; they
# would imply a "fact" that is only true for one tenant.
#
# To promote a useful local entry to this baseline, copy the agnostic fields
# only (drop usage counts and verified_versions) and open a PR.
#
# Intune app-attribute override fields (all optional; each falls back to a
# sensible MSI-derived default when unset):
#   information_url    -- "Help and support" URL shown in the Intune portal.
#                         Defaults to MSI's ARPHELPLINK / ARPURLINFOABOUT.
#   description        -- Short app description (portal Notes field).
#                         Defaults to the MSI's Subject summary property.
#   categories         -- List of Intune mobileAppCategory names attached
#                         to the published app, e.g. ["Productivity"].
#                         Empty list / unset = no categories.
#   min_os_version     -- Required Windows release, e.g. "1607", "1809",
#                         "22H2". Defaults to "1607" (Win10 1607+).
#   icon_b64           -- Base64-encoded image bytes for the app icon.
#                         Use this when the MSI ships an icon as a PE
#                         resource (the pure-Python extractor can't reach
#                         those) and you want a real icon in the portal.
#
# EXE installer fields (type: exe):
#   installer_family   -- Installer engine. One of:
#                          msi, inno_setup, nsis, wix_burn,
#                          msft_bootstrapper, wrapped_msi, wrapped_zip,
#                          custom. Determines the default silent-install
#                          switches (see INSTALLER_FAMILY_SWITCHES) when
#                          install_command_template is omitted.
#   pe_company_name    -- VS_VERSIONINFO CompanyName, used for catalog
#                         lookup when sha256 doesn't match.
#   pe_product_name    -- VS_VERSIONINFO ProductName, same purpose.
#   detection_rules    -- REQUIRED for type: exe. List of rule dicts in
#                         the catalog's normalized form (kind + fields).
#                         See DETECTION_RULE_KINDS in installer_catalog.py
#                         for the kind vocabulary; converted to Graph
#                         win32LobApp*Rule shape by detection_rule_to_graph
#                         at deploy time. Example shapes:
#
#                           - kind: registry_version
#                             key: 'HKLM\Software\Microsoft\Windows\CurrentVersion\Uninstall\AppName'
#                             value_name: DisplayVersion
#                             operator: greaterThanOrEqual
#                             value: "1.2.3"
#
#                           - kind: file_version
#                             path: 'C:\Program Files\AppName'
#                             file: app.exe
#                             operator: greaterThanOrEqual
#                             value: "1.2.3.0"
#
#                           - kind: file_exists
#                             path: 'C:\Program Files\AppName'
#                             folder: AppName
#
#                         For type: msi the pipeline derives a ProductCode
#                         rule automatically from the MSI's own metadata;
#                         detection_rules is normally left unset.

version: 1
entries:
  - id: 7-zip
    type: msi
    upgrade_code: "{23170F69-40C1-2702-0000-000004000000}"
    product_code: "{23170F69-40C1-2702-2408-000001000000}"
    product_name_pattern: "7-Zip"
    publisher: "Igor Pavlov"
    install_command_template: "msiexec /i {installer_filename} /qn /norestart"
    uninstall_command_template: "msiexec /x {23170F69-40C1-2702-2408-000001000000} /qn /norestart"
    installer_family: msi
    information_url: "https://www.7-zip.org/"
    description: "Free open-source file archiver with a high compression ratio."
    categories: ["Productivity"]
    min_os_version: "1607"
    notes: "Standard MSI silent install. Uninstall via ProductCode."

  # ---- EXE example (unverified -- shape only) ------------------------
  # First EXE entry shipped as a worked example of the schema. The
  # install/uninstall switches and the detection-rule registry path are
  # the documented NSIS pattern for Notepad++; an operator should still
  # verify end-to-end on their tenant before relying on it for production
  # deployments. Once verified through the EXE pipeline (when that
  # lands), drop this comment block.
  - id: notepad-plus-plus
    type: exe
    installer_family: nsis
    pe_company_name: "Don HO"  # PE VS_VERSIONINFO ships "Don HO don.h@free.fr"; substring match
    pe_product_name: "Notepad++"
    install_command_template: "{installer_filename} /S"
    uninstall_command_template: '"C:\Program Files\Notepad++\uninstall.exe" /S'
    detection_rules:
      - kind: registry_version
        key: 'HKLM\Software\Microsoft\Windows\CurrentVersion\Uninstall\Notepad++'
        value_name: DisplayVersion
        operator: greaterThanOrEqual
        value: "0.0.0"
    information_url: "https://notepad-plus-plus.org/"
    description: "Free source code editor and Notepad replacement supporting many languages."
    categories: ["Productivity"]
    min_os_version: "1607"
    notes: "NSIS installer. /S is the silent flag. Detection via the Uninstall registry key DisplayVersion."

  # ---- wrapped_msi example (PowerToys) ----------------------------
  # PowerToys ships its installer as a bootstrapper EXE that bundles
  # the MSI internally. The --extract_msi switch drops the MSI into
  # the current working directory; the extractor invokes the command
  # with cwd=extract_dir so the file lands where downstream expects it.
  - id: powertoys
    type: exe
    installer_family: wrapped_msi
    pe_company_name: "Microsoft"
    pe_product_name: "PowerToys"
    install_command_template: "msiexec /i {installer_filename} /qn /norestart"
    extract_command_template: '"{installer_path}" --extract_msi'
    extracted_msi_pattern: "PowerToys*.msi"
    detection_rules:
      - kind: registry_version
        key: 'HKLM\Software\Microsoft\Windows\CurrentVersion\Uninstall\{74B61B4E-A55E-4B6A-A02E-CB7B739D9F8B}'
        value_name: DisplayVersion
        operator: greaterThanOrEqual
        value: "0.0.0"
    information_url: "https://learn.microsoft.com/windows/powertoys/"
    description: "Microsoft PowerToys: utilities to tune and streamline Windows."
    categories: ["Productivity"]
    min_os_version: "1607"
    notes: "wrapped_msi -- IMPORTANT: PowerToys 0.94+ removed the in-bootstrapper --extract_msi shortcut; piloting 0.99.1 confirmed the switch hangs. Per upstream guidance the supported extraction path is now `wix burn extract <exe> -out <dir> -oba <dir>` via the .NET WiX 4 CLI, which we don't ship. Entry is here as a documented unverified placeholder; either install the WiX CLI and update extract_command_template, or use a 0.93-or-earlier build. Detection key (74B61B4E-...) is also a guess -- verify against an actual install."

  # ---- wrapped_msi example (Adobe Reader DC) ----------------------
  # Adobe's self-extracting installer takes -sfx_o to specify the
  # extraction destination and -sfx_ne to suppress launching the
  # installer GUI after extraction. The inner MSI is AcroRead.msi.
  - id: adobe-reader-dc
    type: exe
    installer_family: wrapped_msi
    pe_company_name: "Adobe"
    pe_product_name: "Adobe Acrobat"
    install_command_template: "msiexec /i {installer_filename} /qn /norestart"
    extract_command_template: '"{installer_path}" -sfx_o"{extract_dir}" -sfx_ne'
    extracted_msi_pattern: "AcroRead.msi"
    detection_rules:
      - kind: registry_exists
        key: 'HKLM\Software\Adobe\Acrobat Reader\DC\Installer'
        value_name: Path
    information_url: "https://www.adobe.com/acrobat/pdf-reader.html"
    description: "Adobe Acrobat Reader DC - PDF viewing and annotation."
    categories: ["Productivity"]
    min_os_version: "1607"
    notes: "wrapped_msi -- Adobe self-extractor. Versioned download URL pattern: ardownload2.adobe.com/pub/adobe/reader/win/AcrobatDC/<build>/AcroRdrDCx64<build>_en_US.exe. Unverified."

  # ---- wrapped_zip example (Foxit PDF Reader) ---------------------
  # Foxit's enterprise distribution is a ZIP bundle containing the
  # MSI plus localization MST files and documentation. zipfile
  # extraction is uniform across vendors; no extract command needed.
  - id: foxit-pdf-reader
    type: exe
    installer_family: wrapped_zip
    pe_company_name: "Foxit"
    pe_product_name: "Foxit PDF Reader"
    install_command_template: "msiexec /i {installer_filename} /qn /norestart"
    extracted_msi_pattern: "FoxitPDFReader*.msi"
    detection_rules:
      - kind: registry_exists
        key: 'HKLM\Software\Foxit Software\Foxit PDF Reader'
        value_name: VersionMajor
    information_url: "https://www.foxit.com/pdf-reader/"
    description: "Foxit PDF Reader - free PDF viewer."
    categories: ["Productivity"]
    min_os_version: "1607"
    notes: "wrapped_zip -- IMPORTANT: pilot uncovered that Foxit's public ZIP (FoxitPDFReader20251_L10N_Setup.zip) ships only MST localization transforms, not the base MSI. Their distribution requires the base MSI to be sourced separately (commercial enterprise pack), so this entry can't be unwrapped end-to-end without that base. Kept as documented unverified shape; replace extracted_msi_pattern + URL with the operator's licensed enterprise ZIP when piloting."
