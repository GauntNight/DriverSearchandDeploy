  # ---- Developer tools: EXE installers (Inno/NSIS) ---------------
  # Detection/uninstall values below are best-guess starting points;
  # the local install validator installs each on the build machine,
  # discovers the REAL Uninstall key from the ARP hive diff, and
  # self-corrects the registry_version rule + QuietUninstallString back
  # to the overlay on first publish. Promote the corrected agnostic
  # rule into this baseline afterward.
  - id: r-for-windows
    type: exe
    installer_family: inno_setup
    distribution: standard
    pe_company_name: "R Core Team"
    pe_product_name: "R for Windows"
    install_command_template: "{installer_filename} /VERYSILENT /NORESTART /SUPPRESSMSGBOXES /SP-"
    uninstall_command_template: '"C:\Program Files\R\R-4.6.0\unins000.exe" /VERYSILENT /NORESTART'
    detection_rules:
    - kind: registry_version
      key: HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\R for Windows 4.6.0_is1
      value_name: DisplayVersion
      operator: greaterThanOrEqual
      value: 0.0.0
      check_32bit_on_64bit: true
    information_url: "https://cran.r-project.org/bin/windows/base/"
    description: "R statistical computing environment for Windows (Inno Setup, per-machine)."
    categories: ["Developer Tools"]
    min_os_version: "1607"
    supersedence:
      line: r-for-windows
      mode: generic
    notes: "Inno Setup. PE product 'R for Windows <ver>' matched via substring 'R for Windows'. Uninstall/detection keys are version-specific (R installs to C:\\Program Files\\R\\R-<ver>); validator confirms/corrects on first publish."

