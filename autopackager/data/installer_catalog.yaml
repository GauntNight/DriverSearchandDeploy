    canonical_download_url: "https://2.na.dl.wireshark.org/win64/Wireshark-4.6.6-x64.exe"
    information_url: "https://www.wireshark.org/download.html"
    description: "Wireshark -- network protocol analyzer / packet capture (NSIS, per-machine 64-bit). INCOMPLETE AS A STANDALONE DEPLOY: silent /S installs the app but NOT the Npcap capture driver, so live capture does not work -- a full deployment must ALSO deliver Npcap (OEM), see notes."
    categories: ["Developer Tools"]
    min_os_version: "1607"
    extra_components:
    - id: npcap-oem
      filename_hint: npcap-oem
      acquisition: operator_supplied
      license_note: "Npcap OEM license REQUIRED -- the FREE Npcap installer has no silent /S (OEM-only feature) and a 5-system usage cap. Drop the licensed OEM installer (filename containing 'npcap-oem') in data/wrapper_components/; without it the wrapper build ESCALATES rather than shipping a capture-less Wireshark."
      install_command_template: "{installer_filename} /S /winpcap_mode=yes /loopback_support=yes /admin_only=no"
      uninstall_command_template: '"C:\Program Files\Npcap\Uninstall.exe" /S'
      detection_rules:
      - kind: registry_version
        key: HKLM\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\NpcapInst
        value_name: DisplayVersion
        operator: greaterThanOrEqual
        value: 0.0.0
        check_32bit_on_64bit: true
      required: true
    supersedence:
      line: wireshark
      mode: generic
    notes: "NSIS, per-machine 64-bit. Verified live on ADMIN_BUILD_1 (v4.6.6, 2026-06-17, under a VM snapshot): /S installs the Wireshark APP silently to C:\\Program Files\\Wireshark; detection HKLM Uninstall\\Wireshark (DisplayVersion) fired uncorrected; the validator CORRECTED the uninstaller name to 'uninstall-wireshark.exe' (NOT the NSIS-generic 'uninstall.exe' -- it is uninstall-wireshark.exe /S). NPCAP CAVEAT (important): bare /S installs Wireshark but does NOT install the bundled Npcap kernel capture driver -- after the validation install, no NpcapInst Uninstall key was present, so the SYSTEM-context /S deploy gives users the Wireshark UI WITHOUT packet-capture capability. The bundled Npcap installer is launched only in INTERACTIVE mode. NPCAP LICENSING WALL (confirmed npcap.com 2026): the FREE Npcap installer has NO silent install -- '/S' is an Npcap OEM-only feature, and the free edition also carries a 5-system usage cap; WinPcap is EOL and won't load under modern driver-signing. So there is NO way to silently deliver the capture driver with the free edition. A FUNCTIONAL Wireshark deployment requires an Npcap OEM license (Internal-Use to lift the 5-system cap + get the silent installer, or Redistribution to bundle it) and ONE of these multi-component patterns (NEITHER wired in the pipeline today -- this is a real gap, same class as Adobe's extracted-folder+bootstrapper payload): (1) WRAPPER PACKAGE -- a .intunewin containing Wireshark.exe + npcap-oem.exe + an install.cmd that runs 'wireshark /S' then 'npcap-oem /S', with detection on BOTH; or (2) DEPENDENCY -- publish Npcap-OEM as its own Win32 app and set Wireshark to DEPEND on it (Intune app-dependency relationship -> IME installs Npcap first). As published TODAY this entry is APP-ONLY (capture-less) -- treat as incomplete until the Npcap-OEM component is added. canonical_download_url is VERSION-PINNED (Wireshark's win64 path is versioned; no clean 'latest' redirect) -- bump on new releases."

