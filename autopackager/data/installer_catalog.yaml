# AutoPackager Installer Catalog -- Committed Baseline
#
# Known-good silent-install fingerprints + commands for MSI and EXE installers.
# `cli.py create-software-job` consults this file (plus the local overlay at
# `data/installer_catalog.local.yaml`) before requiring an --install-command.
#
# Matching strategy (MSI):
#   1. UpgradeCode exact match  (most stable across versions of the same app)
#   2. ProductCode exact match  (exact version)
#   3. ProductName pattern (substring, case-insensitive) + Publisher
#
# Template variable: {installer_filename} is the basename of the installer
# inside the .intunewin payload (no path -- Intune IME runs the command from
# the unpacked package root).
#
# BASELINE vs OVERLAY -- read before editing this file.
#
# This baseline carries only environment-AGNOSTIC fields: the MSI / EXE's own
# identity (UpgradeCode, ProductCode, ProductName, Publisher), the silent
# install / uninstall commands that derive from it, AND curated Intune
# app-attribute overrides (information_url, description, categories,
# min_os_version, icon_b64). Those values are the same in every tenant,
# every operator, every machine.
#
# Environment-SPECIFIC fields -- `first_seen`, `last_used`, `use_count`, and
# `verified_versions` (which carries `verified_intune_app_id`, a tenant-bound
# GUID) -- belong in the per-operator local overlay at
# `data/installer_catalog.local.yaml`, NOT here. The overlay is gitignored and
# accumulates organically. Do not promote those fields into the baseline; they
# would imply a "fact" that is only true for one tenant.
#
# To promote a useful local entry to this baseline, copy the agnostic fields
# only (drop usage counts and verified_versions) and open a PR.
#
# Intune app-attribute override fields (all optional; each falls back to a
# sensible MSI-derived default when unset):
#   information_url    -- "Help and support" URL shown in the Intune portal.
#                         Defaults to MSI's ARPHELPLINK / ARPURLINFOABOUT.
#   description        -- Short app description (portal Notes field).
#                         Defaults to the MSI's Subject summary property.
#   categories         -- List of Intune mobileAppCategory names attached
#                         to the published app, e.g. ["Productivity"].
#                         Empty list / unset = no categories.
#   min_os_version     -- Required Windows release, e.g. "1607", "1809",
#                         "22H2". Defaults to "1607" (Win10 1607+).
#   icon_b64           -- Base64-encoded image bytes for the app icon.
#                         Use this when the MSI ships an icon as a PE
#                         resource (the pure-Python extractor can't reach
#                         those) and you want a real icon in the portal.
#
# distribution         -- REQUIRED for new entries. One of:
#                          standard, enterprise (see DISTRIBUTION_KINDS
#                          in installer_catalog.py). Many COTS apps ship
#                          both editions whose installers share
#                          ProductName / Publisher but differ in install
#                          commands and licensing (Adobe Reader DC vs
#                          Acrobat Pro for Enterprise, Zoom standard vs
#                          Zoom for Government, Slack vs Enterprise Grid).
#                          Mark explicitly so audits stay unambiguous;
#                          carry both editions side-by-side when both
#                          ship in your tenant.
#
# Supersedence (CAPABILITY declaration; opt-in at publish time only)
# ------------------------------------------------------------------
# Supersedence is NEVER automatic. Operators opt in per publish via the
# CLI's --supersede (catalog-mode) or --supersedes <id...> (manual
# override) flag. The catalog declares what's POSSIBLE; the publish
# command controls what HAPPENS.
#
# supersedence.line          -- supersedence chain identifier. All
#                               entries sharing a line participate
#                               together. Defaults to entry's `id` when
#                               omitted.
# supersedence.mode          -- REQUIRED on every baseline entry. One of
#                               SUPERSEDENCE_MODES:
#                                 generic   -- newer supersedes older in
#                                              the line (PEP 440 ordering)
#                                 specific  -- only versions matching
#                                              version_pattern are in the
#                                              line (re.fullmatch)
#                                 manual    -- operator-declared explicit
#                                              `supersedes: [id, ...]`
#                                 none      -- DENY in both directions
#                                              (entry never supersedes,
#                                              never gets superseded).
#                                              Use for developer
#                                              middleware where parallel
#                                              versions are intentional
#                                              (JDKs, Python interpreters,
#                                              .NET runtimes). Overrides
#                                              any operator opt-in flag.
# supersedence.version_pattern (specific only) -- re.fullmatch regex.
# supersedence.supersedes      (manual only)   -- list of entry IDs.
#
# WHAT MUST NEVER APPEAR IN THE BASELINE (overlay-only fields)
# ------------------------------------------------------------
# These are per-tenant state, not curated knowledge. A contract test
# (tests/unit/test_installer_catalog.py) enforces their absence on
# every baseline entry.
#
#   version          -- the current/intended version this entry is
#                       tracking. Per-operator (different operators may
#                       be on different versions of the same product at
#                       the same time). Populated by create-software-job.
#   verified_versions-- the publish history with tenant-bound
#                       intune_app_id and per-record status. Populated
#                       by record_verification() / the status state
#                       machine.
#   first_seen, last_used, use_count -- operator-private usage telemetry.
#
# EXE installer fields (type: exe):
#   installer_family   -- Installer engine. One of:
#                          msi, inno_setup, nsis, wix_burn,
#                          msft_bootstrapper, wrapped_msi, wrapped_zip,
#                          custom. Determines the default silent-install
#                          switches (see INSTALLER_FAMILY_SWITCHES) when
#                          install_command_template is omitted.
#   pe_company_name    -- VS_VERSIONINFO CompanyName, used for catalog
#                         lookup when sha256 doesn't match.
#   pe_product_name    -- VS_VERSIONINFO ProductName, same purpose.
#   detection_rules    -- REQUIRED for type: exe. List of rule dicts in
#                         the catalog's normalized form (kind + fields).
#                         See DETECTION_RULE_KINDS in installer_catalog.py
#                         for the kind vocabulary; converted to Graph
#                         win32LobApp*Rule shape by detection_rule_to_graph
#                         at deploy time. Example shapes:
#
#                           - kind: registry_version
#                             key: 'HKLM\Software\Microsoft\Windows\CurrentVersion\Uninstall\AppName'
#                             value_name: DisplayVersion
#                             operator: greaterThanOrEqual
#                             value: "1.2.3"
#
#                           - kind: file_version
#                             path: 'C:\Program Files\AppName'
#                             file: app.exe
#                             operator: greaterThanOrEqual
#                             value: "1.2.3.0"
#
#                           - kind: file_exists
#                             path: 'C:\Program Files\AppName'
#                             folder: AppName
#
#                         For type: msi the pipeline derives a ProductCode
#                         rule automatically from the MSI's own metadata;
#                         detection_rules is normally left unset.

version: 1
entries:
  - id: 7-zip
    type: msi
    upgrade_code: "{23170F69-40C1-2702-0000-000004000000}"
    product_code: "{23170F69-40C1-2702-2601-000001000000}"
    product_name_pattern: "7-Zip"
    publisher: "Igor Pavlov"
    install_command_template: "msiexec /i {installer_filename} /qn /norestart"
    uninstall_command_template: "msiexec /x {23170F69-40C1-2702-2601-000001000000} /qn /norestart"
    installer_family: msi
    distribution: standard
    supersedence:
      line: 7-zip
      mode: generic
    information_url: "https://www.7-zip.org/"
    description: "Free open-source file archiver with a high compression ratio."
    categories: ["Productivity"]
    min_os_version: "1607"
    notes: "Standard MSI silent install. Uninstall via ProductCode."

  # ---- EXE example (unverified -- shape only) ------------------------
  # First EXE entry shipped as a worked example of the schema. The
  # install/uninstall switches and the detection-rule registry path are
  # the documented NSIS pattern for Notepad++; an operator should still
  # verify end-to-end on their tenant before relying on it for production
  # deployments. Once verified through the EXE pipeline (when that
  # lands), drop this comment block.
  - id: notepad-plus-plus
    type: exe
    installer_family: nsis
    distribution: standard
    supersedence:
      line: notepad-plus-plus
      mode: generic
    pe_company_name: "Don HO"  # PE VS_VERSIONINFO ships "Don HO don.h@free.fr"; substring match
    pe_product_name: "Notepad++"
    install_command_template: "{installer_filename} /S"
    uninstall_command_template: '"C:\Program Files\Notepad++\uninstall.exe" /S'
    detection_rules:
      - kind: registry_version
        key: 'HKLM\Software\Microsoft\Windows\CurrentVersion\Uninstall\Notepad++'
        value_name: DisplayVersion
        operator: greaterThanOrEqual
        value: "0.0.0"
    information_url: "https://notepad-plus-plus.org/"
    description: "Free source code editor and Notepad replacement supporting many languages."
    categories: ["Productivity"]
    min_os_version: "1607"
    notes: "NSIS installer. /S is the silent flag. Detection via the Uninstall registry key DisplayVersion."

  # ---- wrapped_msi example (PowerToys) ----------------------------
  # PowerToys ships its installer as a Microsoft Burn bundle that wraps
  # an inner MSI. The bundle ignores unknown switches and falls back to
  # its interactive installer UI, so there is no usable extract switch
  # (--extract_msi / -extract_msi / /extract_msi all just launch setup).
  # Like Snagit's current EXE, we therefore ship the bootstrapper EXE as
  # the .intunewin payload (msft_bootstrapper) and detect via the inner
  # MSI's ProductCode in the Uninstall hive. /quiet /norestart are the
  # standard Burn silent switches.
  - id: powertoys
    type: exe
    installer_family: msft_bootstrapper
    distribution: standard
    supersedence:
      line: powertoys
      mode: generic
    pe_company_name: "Microsoft"
    pe_product_name: "PowerToys"
    install_command_template: "{installer_filename} /quiet /norestart"
    uninstall_command_template: "msiexec /x {23F8E1BE-FE45-4FAD-B98C-1932DCDD0B70} /qn /norestart"
    detection_rules:
      - kind: registry_version
        key: 'HKLM\Software\Microsoft\Windows\CurrentVersion\Uninstall\{23F8E1BE-FE45-4FAD-B98C-1932DCDD0B70}'
        value_name: DisplayVersion
        operator: greaterThanOrEqual
        value: "0.99.0"
    information_url: "https://learn.microsoft.com/windows/powertoys/"
    description: "Microsoft PowerToys: utilities to tune and streamline Windows."
    categories: ["Productivity"]
    min_os_version: "1607"
    notes: "Microsoft Burn bundle, shipped as msft_bootstrapper (not wrapped_msi -- the --extract_msi/-extract_msi//extract_msi switches were probed live on 0.99.1 and all just launch the interactive installer, dropping no MSI). Inner MSI ProductCode {23F8E1BE-FE45-4FAD-B98C-1932DCDD0B70} and Burn bundle GUID {39FF9837-4722-49F9-92B9-051A50B1E36F} both register in the Uninstall hive (DisplayName 'PowerToys (Preview)'); verified by controlled install of 0.99.1 on 2026-06-02. Detection + uninstall key on the inner MSI ProductCode. /quiet /norestart confirmed exit 0 for both install and bundle /uninstall /quiet."

  # ---- wrapped_msi example (Adobe Reader DC) ----------------------
  # Adobe's self-extracting installer takes -sfx_o to specify the
  # extraction destination and -sfx_ne to suppress launching the
  # installer GUI after extraction. The inner MSI is AcroRead.msi.
  - id: adobe-reader-dc
    type: exe
    installer_family: wrapped_msi
    distribution: standard  # Public Acrobat Reader DC download. The Adobe Customization Wizard / Enterprise pack would be a separate entry with distribution: enterprise.
    supersedence:
      line: adobe-reader-dc
      mode: generic
    pe_company_name: "Adobe"
    pe_product_name: "Adobe Acrobat"
    install_command_template: "msiexec /i {installer_filename} /qn /norestart"
    extract_command_template: '"{installer_path}" -sfx_o"{extract_dir}" -sfx_ne'
    extracted_msi_pattern: "AcroRead.msi"
    detection_rules:
      - kind: registry_exists
        key: 'HKLM\Software\Adobe\Acrobat Reader\DC\Installer'
        value_name: Path
    information_url: "https://www.adobe.com/acrobat/pdf-reader.html"
    description: "Adobe Acrobat Reader DC - PDF viewing and annotation."
    categories: ["Productivity"]
    min_os_version: "1607"
    notes: "wrapped_msi -- Adobe self-extractor. Versioned download URL pattern: ardownload2.adobe.com/pub/adobe/reader/win/AcrobatDC/<build>/AcroRdrDCx64<build>_en_US.exe. Unverified."

  # ---- wrapped_zip example (Foxit PDF Reader) ---------------------
  # Foxit's enterprise distribution is a ZIP bundle containing the
  # MSI plus localization MST files and documentation. zipfile
  # extraction is uniform across vendors; no extract command needed.
  - id: foxit-pdf-reader
    type: exe
    installer_family: wrapped_zip
    distribution: standard  # Public Foxit PDF Reader bundle. The Foxit Enterprise Pack (commercial license, separate URL) would be a separate entry with distribution: enterprise.
    supersedence:
      line: foxit-pdf-reader
      mode: generic
    pe_company_name: "Foxit"
    pe_product_name: "Foxit PDF Reader"
    install_command_template: "msiexec /i {installer_filename} /qn /norestart"
    extracted_msi_pattern: "FoxitPDFReader*.msi"
    detection_rules:
      - kind: registry_exists
        key: 'HKLM\Software\Foxit Software\Foxit PDF Reader'
        value_name: VersionMajor
    information_url: "https://www.foxit.com/pdf-reader/"
    description: "Foxit PDF Reader - free PDF viewer."
    categories: ["Productivity"]
    min_os_version: "1607"
    notes: "wrapped_zip -- IMPORTANT: pilot uncovered that Foxit's public ZIP (FoxitPDFReader20251_L10N_Setup.zip) ships only MST localization transforms, not the base MSI. Their distribution requires the base MSI to be sourced separately (commercial enterprise pack), so this entry can't be unwrapped end-to-end without that base. Kept as documented unverified shape; replace extracted_msi_pattern + URL with the operator's licensed enterprise ZIP when piloting."

  # ---- Snagit 2023 MSI (TechSmith, licensed) ---------------------
  # First entry in the manual-mode Snagit MSI supersedence chain.
  # Snagit 2023 (v23.x) and Snagit (v26.x, no year suffix in product
  # name) ship with DIFFERENT UpgradeCodes AND different ProductName
  # patterns, so generic / specific supersedence modes cannot link
  # them as a single line. Operators declare the chain explicitly via
  # mode: manual + supersedes on the newer entry.
  - id: snagit-2023
    type: msi
    upgrade_code: "{D09A33E8-C03D-461C-9DBD-3DBB7240D5B3}"
    product_code: "{8740B15B-4F85-4184-B217-E25AD2BAAD75}"
    product_name_pattern: "Snagit 2023"
    publisher: "TechSmith Corporation"
    install_command_template: "msiexec /i {installer_filename} /qn /norestart"
    uninstall_command_template: "msiexec /x {8740B15B-4F85-4184-B217-E25AD2BAAD75} /qn /norestart"
    installer_family: msi
    distribution: enterprise
    supersedence:
      line: snagit
      mode: manual
    information_url: "https://www.techsmith.com/screen-capture.html"
    description: "TechSmith Snagit 2023 -- screen capture and screen recording."
    categories: ["Productivity"]
    min_os_version: "1607"
    notes: "Licensed commercial software. Snagit ships unactivated; operator activates post-install on the target device (license key, not silent-install switch). Chain root for the snagit manual-supersedence line."

  # ---- Snagit (current major) MSI (TechSmith, licensed) ----------
  # Snagit dropped the year suffix from the ProductName at v26
  # (Snagit 2023 -> Snagit). UpgradeCode also changes between
  # majors. mode: manual makes the supersedence relationship
  # explicit. Add new majors as additional entries with
  # supersedes: [<previous-major-id>].
  - id: snagit
    type: msi
    upgrade_code: "{3C12DDAF-5C49-495C-BDD9-5298E10BF718}"
    product_code: "{4FE14B9F-0810-4E92-B6F5-0921D0936119}"
    product_name_pattern: "Snagit"
    publisher: "TechSmith Corporation"
    install_command_template: "msiexec /i {installer_filename} /qn /norestart"
    uninstall_command_template: "msiexec /x {4FE14B9F-0810-4E92-B6F5-0921D0936119} /qn /norestart"
    installer_family: msi
    distribution: enterprise
    supersedence:
      line: snagit
      mode: manual
      supersedes: [snagit-2023]
    information_url: "https://www.techsmith.com/screen-capture.html"
    description: "TechSmith Snagit -- screen capture and screen recording."
    categories: ["Productivity"]
    min_os_version: "1607"
    notes: "Licensed commercial software. ProductName matching uses the bare 'Snagit' substring; this pattern would also match 'Snagit 2023' so MSI lookup must prefer UpgradeCode (3C12DDAF...) over ProductName when both are present. The pipeline does (UpgradeCode is tried first)."

  # ---- Snagit 2023 EXE bootstrapper (TechSmith, licensed) --------
  # First entry in the manual-mode Snagit EXE supersedence chain.
  # Older Snagit 2023 bootstrapper PE InternalName is 'setup' (not
  # Burn), but accepts the standard /quiet /norestart switch pair.
  # Catalog ships the EXE as msft_bootstrapper rather than
  # wrapped_msi because the bootstrapper's attached container is
  # not extractable without WiX dark.exe / wix burn extract, and
  # we don't ship that dependency.
  - id: snagit-2023-bootstrapper
    type: exe
    installer_family: msft_bootstrapper
    distribution: enterprise
    supersedence:
      line: snagit-bootstrapper
      mode: manual
    pe_company_name: "TechSmith Corporation"
    pe_product_name: "Snagit 2023"
    install_command_template: "{installer_filename} /quiet /norestart"
    uninstall_command_template: "msiexec /x {8740B15B-4F85-4184-B217-E25AD2BAAD75} /qn /norestart"
    detection_rules:
      - kind: registry_version
        key: 'HKLM\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8740B15B-4F85-4184-B217-E25AD2BAAD75}'
        value_name: DisplayVersion
        operator: greaterThanOrEqual
        value: "23.0.0"
    information_url: "https://www.techsmith.com/screen-capture.html"
    description: "TechSmith Snagit 2023 -- screen capture and screen recording. EXE bootstrapper."
    categories: ["Productivity"]
    min_os_version: "1607"
    notes: "Licensed commercial software. Older Snagit 2023 bootstrapper engine is not Microsoft Burn (InternalName='setup'); /quiet /norestart is the documented silent switch but operator should verify install behavior on first Phase 2.5 N-1 run."

  # ---- Snagit (current major) EXE bootstrapper -------------------
  # Current Snagit EXE is a Microsoft Burn bundle (PE InternalName
  # 'burn'); catalog ships it as msft_bootstrapper for the reasons
  # noted on snagit-2023-bootstrapper.
  - id: snagit-bootstrapper
    type: exe
    installer_family: msft_bootstrapper
    distribution: enterprise
    supersedence:
      line: snagit-bootstrapper
      mode: manual
      supersedes: [snagit-2023-bootstrapper]
    pe_company_name: "TechSmith Corporation"
    pe_product_name: "Snagit"
    install_command_template: "{installer_filename} /quiet /norestart"
    uninstall_command_template: "msiexec /x {4FE14B9F-0810-4E92-B6F5-0921D0936119} /qn /norestart"
    detection_rules:
      - kind: registry_version
        key: 'HKLM\Software\Microsoft\Windows\CurrentVersion\Uninstall\{4FE14B9F-0810-4E92-B6F5-0921D0936119}'
        value_name: DisplayVersion
        operator: greaterThanOrEqual
        value: "26.0.0"
    information_url: "https://www.techsmith.com/screen-capture.html"
    description: "TechSmith Snagit -- screen capture and screen recording. EXE bootstrapper (Microsoft Burn)."
    categories: ["Productivity"]
    min_os_version: "1607"
    notes: "Licensed commercial software. Burn bundle; /quiet /norestart are standard Burn switches. pe_product_name 'Snagit' also matches 'Snagit 2023' as a substring, so catalog lookup must prefer SHA-256 hash match (when seen) or pe_product_version over name. The pipeline does."
