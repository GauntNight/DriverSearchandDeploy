- id: chrome-consumer
  type: exe
  install_command_template: '{installer_filename} /silent /install'
  distribution: standard
  installer_family: custom
  pe_company_name: Google LLC
  pe_product_name: Google Installer (x86)
  information_url: https://www.google.com/chrome/
  description: Google Chrome (consumer online stub). NOT a managed-deployment target
    -- see consumer_caveats; intake substitutes chrome-enterprise.
  categories:
  - Productivity
  min_os_version: '1607'
  supersedence:
    mode: none
  prefer_entry_id: chrome-enterprise
  consumer_caveats: 'Consumer ''ChromeSetup.exe'' is Google''s online updater STUB
    (OriginalFilename UpdaterSetup.exe; PE product name ''Google Installer (x86)'').
    It ignores standard silent switches (/VERYSILENT, /S), detaches an elevated GoogleUpdater
    that downloads + installs the full Chrome browser and LAUNCHES it, and registers
    a self-relaunching updater scheduled task + services -- all of which fight managed
    deployment. Use the enterprise MSI (chrome-enterprise): it installs silently via
    msiexec /qn, exposes a stable UpgradeCode for supersedence, and respects enterprise
    policy.'
  canonical_download_url: https://dl.google.com/chrome/install/ChromeSetup.exe
  notes: ChromeSetup.exe is the GENERIC Google Updater bootstrapper (PE product name
    'Google Installer (x86)', OriginalFilename UpdaterSetup.exe) -- the same stub
    Google ships for several products, so this PE match is Chrome-assuming (Chrome
    is by far the dominant case). Carried ONLY to detect the mistake and redirect
    to chrome-enterprise. Intentionally has no detection_rules -- it must never publish;
    the substitution intercepts first. supersedence.mode=none (never a supersedence
    target).
