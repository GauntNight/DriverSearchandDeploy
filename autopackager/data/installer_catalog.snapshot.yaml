# AutoPackager Installer Catalog -- tenant-AGNOSTIC snapshot.
#
# Generated by `cli.py catalog export`. Carries ONLY environment-agnostic
# rules (install/uninstall commands, detection rules, installer family,
# supersedence capability, Intune attribute overrides). All tenant-specific
# fields are stripped: first_seen, last_used, use_count, version, and
# verified_versions (which holds tenant-bound Intune app GUIDs).
#
# Safe to commit and share. To promote entries into the shipped baseline,
# review them and copy into autopackager/data/installer_catalog.yaml.
#
version: 1
entries:
