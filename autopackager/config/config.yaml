# AutoPackager Configuration

# Database Configuration
# Defaults to SQLite for a zero-dependency local setup. To use PostgreSQL,
# set type to "postgresql" and install the driver (see requirements-postgres.txt).
database:
  type: "sqlite"
  path: "autopackager.db"
  # PostgreSQL settings (used only when type is "postgresql"):
  host: "localhost"
  port: 5432
  name: "autopackager"
  user: "autopackager_user"
  password: "${DB_PASSWORD}"

# Redis Configuration (for Celery)
redis:
  host: "localhost"
  port: 6379
  db: 0

# Microsoft Intune / Graph API
intune:
  tenant_id: "${AZURE_TENANT_ID}"
  client_id: "${AZURE_CLIENT_ID}"
  client_secret: "${AZURE_CLIENT_SECRET}"
  graph_api_version: "v1.0"
  graph_endpoint: "https://graph.microsoft.com"

# LLM Configuration
llm:
  provider: "openai"  # openai, azure_openai, or anthropic
  api_key: "${LLM_API_KEY}"
  model: "gpt-4-turbo-preview"
  temperature: 0.2
  max_tokens: 4096

# OEM Driver Catalogs
oem_catalogs:
  dell:
    enabled: true
    catalog_url: "https://downloads.dell.com/catalog/DriverPackCatalog.cab"
    catalog_path: "data/catalogs/dell"
  hp:
    enabled: true
    catalog_url: "https://hpia.hpcloud.hp.com/ref/platformlist.cab"
    catalog_path: "data/catalogs/hp"
  lenovo:
    enabled: true
    catalog_url: "https://download.lenovo.com/cdrt/td/catalogv2.xml"
    catalog_path: "data/catalogs/lenovo"

# Discovery Schedule Configuration
discovery_schedule:
  enabled: true
  interval_hours: 24
  catalogs:
    - dell
    - hp
    - lenovo
  notification_email: "${DISCOVERY_NOTIFICATION_EMAIL}"
  retry_on_failure: true
  max_retries: 3
  monitored_models:
    - vendor: "Dell"
      model: "Latitude 7400"
      driver_type: "all"
      current_version: "1.0.0"

# Deployment Rings
deployment_rings:
  - name: "IT Pilot"
    ring_id: "ring0"
    entra_group_id: "${RING0_GROUP_ID}"
    deferral_days: 0
  - name: "Early Adopters"
    ring_id: "ring1"
    entra_group_id: "${RING1_GROUP_ID}"
    deferral_days: 3
  - name: "Broad Deployment"
    ring_id: "ring2"
    entra_group_id: "${RING2_GROUP_ID}"
    deferral_days: 7
  - name: "Critical Systems"
    ring_id: "ring3"
    entra_group_id: "${RING3_GROUP_ID}"
    deferral_days: 14

# Rollback Configuration
rollback:
  enabled: true
  failure_threshold_percent: 20.0
  minimum_install_count: 5

# Ring Promotion Configuration
ring_promotion:
  enabled: true
  success_threshold_percent: 90.0
  minimum_install_count: 10
  evaluation_period_hours: 48
  auto_promote: true
  # How often the Celery Beat scheduler runs the automatic promotion check.
  check_interval_hours: 6

# Scheduled software version check (demo "refresh" brain — the daily half).
# The scheduled daily update run. `enabled` here activates the Beat SCHEDULE;
# whether a run actually acts is gated at runtime by the global daily-update flag
# (toggled in the console — "Daily: ON/off"). When both are on, every Latest app
# whose product is set to autoupdate ("Update") is full-auto upgraded; apps not
# set to autoupdate are left for the operator's manual "Check updates". Honours
# DEMO_CLAUDE_MODE (replay | live | off). Worker restart picks up schedule changes.
version_check_schedule:
  enabled: true
  interval_hours: 24

# Unmanaged-software delta (what's installed in the environment but not packaged).
# Drives `cli.py discover-unmanaged` + the demo delta panel. The classifier sorts
# every installed app into: managed (published to Intune) / known_packageable (in
# the catalog, not yet published) / standard_os_component / unmanaged_candidate /
# ignored. These patterns (case-insensitive regex, matched against DisplayName)
# define the "standard OS component" bucket and the ignore list. Microsoft *apps*
# (Azure CLI, VS Code, PowerShell) are deliberately NOT listed here -- they are
# packaging candidates like any vendor.
software_delta:
  microsoft_os_components:
    - "^Microsoft Edge($| WebView2| Update)"
    - "^Microsoft OneDrive"
    - "^Microsoft Intune Management Extension"
    - "^Microsoft Visual C\\+\\+ \\d{4}"          # VC++ redistributables
    - "^Microsoft \\.NET (Runtime|Host|Targeting|SDK|Framework)"
    - "^Windows (SDK|Software Development Kit|App Certification)"
    - "^Microsoft Update Health Tools"
    - "^Microsoft Windows Desktop Runtime"
    - "Redistributable"                            # generic runtime redists
  ignore_patterns:
    - "^KB\\d+"                                     # standalone update packages
    - "Security Update"
    - "^Update for "
    - "Hotfix"

# Packaging queue: turn the software-delta backlog into packaging jobs. Queued
# items are always GATED (deployment held for the approval gate) and TEST scope
# (Ring 0) — a bulk select must never silently write the tenant. Items are
# processed one at a time so the box-bound install validation never overlaps.
packaging_queue:
  default_scope: "test"      # test (Ring 0) only; "all" not enabled for the queue
  default_gate: true         # always hold deployment for the approval gate
  max_concurrent: 1          # process one queued item at a time

# Paths
paths:
  downloads: "data/downloads"
  packages: "data/packages"
  logs: "data/logs"
  psadt_template: "scripts/psadt"
  intunewin_util: "tools/IntuneWinAppUtil.exe"

# Testing Configuration
testing:
  enabled: true
  vm_provider: "local"  # local or azure
  snapshot_name: "clean_windows_11"
  timeout_minutes: 30
  # Local install validation: actually install the package on THIS build
  # machine, verify it landed (correcting the detection rule from the app's
  # real Uninstall key if the configured rule doesn't fire), then uninstall —
  # all BEFORE publishing to Intune. Publishing is gated on this passing.
  # Auto-skipped under pytest (TESTING=true). A Hyper-V-isolated path can be
  # slotted in later behind the same step.
  local_install_validation:
    enabled: true
    # A non-silent installer that pops a UI hangs until this fires (then the
    # whole process tree is killed and the validation fails WITHOUT retry).
    # Keep it tight so a bad silent-command fails fast on stage; raise only for
    # genuinely huge installers. Most apps install in well under a minute.
    timeout_seconds: 240
    uninstall_timeout_seconds: 180

# Logging
logging:
  level: "INFO"
  format: "json"
  file: "data/logs/autopackager.log"

# Job Settings
jobs:
  max_retries: 3
  retry_delay_seconds: 300
  concurrent_jobs: 5
