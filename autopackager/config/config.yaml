# AutoPackager Configuration

# Database Configuration
database:
  type: "sqlite"
  path: "data/autopackager.db"

# Redis Configuration (for Celery)
redis:
  host: "localhost"
  port: 6379
  db: 0

# Microsoft Intune / Graph API
intune:
  tenant_id: "${AZURE_TENANT_ID}"
  client_id: "${AZURE_CLIENT_ID}"
  client_secret: "${AZURE_CLIENT_SECRET}"
  graph_api_version: "v1.0"
  graph_endpoint: "https://graph.microsoft.com"

# LLM Configuration
llm:
  provider: "openai"  # openai, azure_openai, or anthropic
  api_key: "${LLM_API_KEY}"
  model: "gpt-4-turbo-preview"
  temperature: 0.2
  max_tokens: 4096

# OEM Driver Catalogs
oem_catalogs:
  dell:
    enabled: true
    catalog_url: "https://downloads.dell.com/catalog/DriverPackCatalog.cab"
    catalog_path: "data/catalogs/dell"
  hp:
    enabled: true
    catalog_url: "https://hpia.hpcloud.hp.com/ref/platformlist.cab"
    catalog_path: "data/catalogs/hp"
  lenovo:
    enabled: true
    catalog_url: "https://download.lenovo.com/cdrt/td/catalogv2.xml"
    catalog_path: "data/catalogs/lenovo"

# Deployment Rings
deployment_rings:
  - name: "IT Pilot"
    ring_id: "ring0"
    entra_group_id: "${RING0_GROUP_ID}"
    deferral_days: 0
  - name: "Early Adopters"
    ring_id: "ring1"
    entra_group_id: "${RING1_GROUP_ID}"
    deferral_days: 3
  - name: "Broad Deployment"
    ring_id: "ring2"
    entra_group_id: "${RING2_GROUP_ID}"
    deferral_days: 7
  - name: "Critical Systems"
    ring_id: "ring3"
    entra_group_id: "${RING3_GROUP_ID}"
    deferral_days: 14

# Paths
paths:
  downloads: "data/downloads"
  packages: "data/packages"
  logs: "data/logs"
  psadt_template: "scripts/psadt"
  intunewin_util: "tools/IntuneWinAppUtil.exe"

# Testing Configuration
testing:
  enabled: true
  vm_provider: "local"  # local or azure
  snapshot_name: "clean_windows_11"
  timeout_minutes: 30

  # VM Provider Configuration
  vm_config:
    # Hyper-V Provider Settings (for local testing)
    hyperv:
      vm_name: "AutoPackager-TestVM"
      snapshot_name: "clean_windows_11"
      switch_name: "Default Switch"
      memory_mb: 4096
      processors: 2
      boot_timeout_seconds: 300

    # Azure Provider Settings (for cloud-based testing)
    azure:
      resource_group: "${AZURE_TEST_RG}"
      vm_size: "Standard_D2s_v3"
      image_reference:
        publisher: "MicrosoftWindowsDesktop"
        offer: "Windows-11"
        sku: "win11-22h2-pro"
        version: "latest"
      admin_username: "azureuser"
      admin_password: "${AZURE_VM_ADMIN_PASSWORD}"
      location: "eastus"
      boot_timeout_seconds: 600

    # Common Settings
    timeout_minutes: 30
    max_retries: 2
    cleanup_on_failure: true

# Logging
logging:
  level: "INFO"
  format: "json"
  file: "data/logs/autopackager.log"

# Job Settings
jobs:
  max_retries: 3
  retry_delay_seconds: 300
  concurrent_jobs: 5
